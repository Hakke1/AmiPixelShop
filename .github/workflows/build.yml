name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  amiga:
    runs-on: ubuntu-latest
    container:
      # bebbo's m68k-amigaos-gcc with NDK 3.2, AmiSSL, P96 and Roadshow headers, vasm and lha
      image: sacredbanana/amiga-compiler:m68k-amigaos@sha256:c3f7b87d571a3d8a8e8d49d0ad798a08483d17363adc0488925b28772e0b3a65
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          command -v m68k-amigaos-gcc vasmm68k_mot lha python3
          m68k-amigaos-gcc --version | head -n 1
      - name: Build
        run: make -j"$(nproc)" build/AmiPixelShop
      - name: Archive and update package
        run: sh tools/mkpkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AmiPixelShop-amiga
          path: |
            build/AmiPixelShop.lha
            build/AmiPixelShop.upd

  # A tag like v0.6.2 (higher than src/version.h of installed copies) makes a GitHub
  # release, which the built-in updater (src/update.c, UPD_REPO) offers at start.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: amiga
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AmiPixelShop-amiga
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AmiPixelShop.lha
            AmiPixelShop.upd
          prerelease: true
          generate_release_notes: true
